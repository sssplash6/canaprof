<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профориентация · CANA School</title>
  <meta name="description" content="Профориентационный тест: интересы, характер, навыки. Отчёт с профессиями, зарплатами по странам и планом до университета.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/landing.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <span data-brand></span>
      <span class="spacer"></span>
      <button class="btn btn-text btn-sm" type="button" popovertarget="about" data-t="nav.about"></button>
      <div class="seg" data-lang-switch></div>
    </div>
  </header>

  <div id="about" class="about" popover>
    <h2 data-t="hero.title"></h2>
    <p class="muted" data-t="hero.lead"></p>
    <h3 class="kicker" data-t="parts.title"></h3>
    <ol class="parts" id="parts"></ol>
    <h3 class="kicker" data-t="get.title"></h3>
    <ol class="gets" id="gets"></ol>
    <p class="fine"><span data-t="foot.method"></span> <span data-t="foot.note"></span></p>
    <a class="btn btn-ghost btn-sm" href="/results" data-t="nav.sample"></a>
  </div>

  <main id="main" class="solo">
    <form class="panel form" id="form" novalidate>
      <h1 data-t="form.title"></h1>
      <div id="resume"></div>
      <div class="field" id="f-name">
        <label for="name" data-t="form.name"></label>
        <input class="input" id="name" autocomplete="given-name" maxlength="60" data-t-ph="form.namePh">
        <p class="err" data-t="err.name"></p>
      </div>
      <div class="field" id="f-grade">
        <label for="grade" data-t="form.grade"></label>
        <select class="input" id="grade"></select>
        <p class="err" data-t="err.grade"></p>
      </div>
      <div class="field" id="f-country">
        <label for="country" data-t="form.country"></label>
        <select class="input" id="country"></select>
        <p class="err" data-t="err.country"></p>
      </div>
      <button class="btn btn-lg btn-block" type="submit" id="start"></button>
      <p class="note" data-t="form.time"></p>
    </form>
  </main>
</body>
</html>
