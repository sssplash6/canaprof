<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..800&family=Manrope:wght@400..800&display=swap">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <span data-brand></span>
      <span class="tag tag-mono" data-t="adm.label"></span>
      <span class="spacer"></span>
      <div class="seg" data-lang-switch></div>
    </div>
  </header>
  <main id="main" class="wrap adm">
    <div class="adm-head">
      <div>
        <h1 data-t="adm.title"></h1>
        <p class="muted num" id="total"></p>
      </div>
      <button class="btn btn-ghost" id="xlsx" type="button" disabled></button>
    </div>
    <div class="sec-tools">
      <div class="adm-filters">
        <div class="seg" id="grades" role="group" data-t-label="form.grade"></div>
        <div class="seg" id="tracks" role="group" data-t-label="form.track"></div>
      </div>
      <label class="sort"><span class="sr-only" data-t="adm.search"></span>
        <input class="input" id="q" type="search" autocomplete="off" data-t-ph="adm.search">
      </label>
    </div>
    <div id="body"><div class="state"><div class="spinner" aria-hidden="true"></div></div></div>
  </main>
</body>
</html>
